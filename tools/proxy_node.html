<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f6f5">
    <title>OpenDHT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            color-scheme: light;
            --page: #f6f7f9;
            --surface: #fff;
            --subtle: #f0f2f5;
            --ink: #20252b;
            --muted: #737b87;
            --line: #e3e6eb;
            --accent: #11765c;
            --accent-bg: #e8f5ee;
            --danger: #bb3d46;
            --danger-bg: #fff0f0;
            --amber: #a56b13;
            --shadow: 0 8px 32px #20252b0b;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'DM Sans', sans-serif;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --page: #17191c;
            --surface: #202327;
            --subtle: #2a2e33;
            --ink: #edf0f3;
            --muted: #a0a8b2;
            --line: #353a41;
            --accent: #72d6ae;
            --accent-bg: #243d33;
            --danger: #ff9299;
            --danger-bg: #40272c;
            --amber: #e3bc71;
            --shadow: 0 8px 32px #0002;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--page);
            color: var(--ink);
            font: 14px/1.5 var(--sans);
            letter-spacing: 0;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        button,
        a,
        input,
        select,
        textarea {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            cursor: pointer;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 6px;
        }

        button:disabled {
            opacity: .5;
            cursor: wait;
        }

        button,
        input,
        select,
        textarea,
        summary {
            outline-offset: 3px;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
        }

        button:hover:not(:disabled) {
            background: var(--subtle);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        input,
        select,
        textarea {
            min-width: 0;
            max-width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            padding: 10px 12px;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--muted);
            opacity: .8;
        }

        input:focus,
        textarea:focus {
            border-color: var(--accent);
        }

        input[type="checkbox"],
        input[type="radio"] {
            accent-color: var(--accent);
        }

        textarea {
            resize: vertical;
            font: 13px/1.7 var(--mono);
        }

        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        h1 {
            font-size: 30px;
            font-weight: 650;
            line-height: 1.25;
        }

        h2 {
            font-size: 16px;
            font-weight: 650;
        }

        .bi {
            display: inline-block;
            flex-shrink: 0;
            font-size: 16px;
            line-height: 1;
        }

        .mono {
            font-family: var(--mono);
        }

        .muted {
            color: var(--muted);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        [hidden] {
            display: none !important;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 15px;
            min-height: 40px;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn.primary {
            color: #fff;
            background: #14785c;
            border-color: #14785c;
        }

        .btn.primary:hover:not(:disabled) {
            background: #0c6048;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            padding: 0;
            flex: 0 0 34px;
            background: transparent;
            border-color: transparent;
            color: var(--muted);
        }

        .icon-btn:hover:not(:disabled) {
            color: var(--ink);
            border-color: var(--line);
        }

        .icon-btn.danger:hover {
            color: var(--danger);
            background: var(--danger-bg);
        }

        .icon-btn[aria-pressed="true"] {
            background: var(--accent-bg);
            color: var(--accent);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 23px;
            font-weight: 700;
        }

        .connection-pill,
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .connection-pill {
            font-size: 12px;
            color: var(--muted);
        }

        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }

        .connected {
            color: var(--accent);
        }

        .section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 15px;
        }

        .server-label {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 7px;
        }

        .server-control {
            display: flex;
            gap: 6px;
        }

        .server-control input {
            width: 100%;
            padding: 9px;
            font: 11px var(--mono);
        }

        .server-control button {
            border-color: var(--line);
            height: 36px;
        }

        .node-line {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 16px;
            font-size: 12px;
        }

        .node-line .bi {
            color: var(--accent);
        }

        .node-id {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            font-size: 10px;
            color: var(--muted);
        }

        .node-line .icon-btn {
            width: 26px;
            height: 26px;
            flex-basis: 26px;
        }

        .network-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 17px;
            font-size: 11px;
        }

        .network-pair span {
            display: block;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .network-pair strong {
            font-weight: 500;
        }

        .connection-error {
            color: var(--danger);
            font-size: 11px;
            margin-top: 12px;
            overflow-wrap: anywhere;
        }

        .directory {
            padding: 22px 12px;
            flex: 1;
        }

        .directory .section-label {
            padding: 0 8px;
            margin-bottom: 8px;
        }

        .directory-empty {
            padding: 10px 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .directory-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 11px 9px;
            border: 0;
            text-align: left;
            margin: 3px 0;
        }

        .directory-key {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            font: 11px var(--mono);
        }

        .directory-count {
            color: var(--muted);
            font: 10px var(--mono);
        }

        .session-form {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .key-field {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .key-field>.bi {
            position: absolute;
            top: 14px;
            left: 13px;
            color: var(--muted);
        }

        .key-field input {
            width: 100%;
            padding-left: 38px;
            min-height: 44px;
            font-size: 13px;
        }

        .segments {
            display: inline-flex;
            padding: 3px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--subtle);
            flex-shrink: 0;
        }

        .segments label {
            position: relative;
            cursor: pointer;
        }

        .segments input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
        }

        .segments label>span {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 7px 11px;
            font-size: 12px;
            border: 1px solid transparent;
            border-radius: 4px;
            white-space: nowrap;
        }

        .segments input:checked+span {
            background: var(--surface);
            border-color: var(--line);
            box-shadow: 0 1px 3px #00000006;
        }

        .segments input:focus-visible+span {
            outline: 2px solid var(--accent);
        }

        .segments .bi {
            font-size: 13px;
        }

        .session-form>.btn {
            min-height: 44px;
        }

        .workspace-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
            margin-bottom: 17px;
            flex-wrap: wrap;
        }

        .tabs {
            display: flex;
            gap: 19px;
            align-self: stretch;
        }

        .tab {
            color: var(--muted);
            background: none;
            border: 0;
            border-radius: 0;
            padding: 9px 0;
            border-bottom: 2px solid transparent;
            font-size: 12px;
        }

        .tab[aria-pressed="true"] {
            color: var(--ink);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        .tab-count {
            display: inline-block;
            min-width: 19px;
            padding: 1px 5px;
            background: var(--subtle);
            font: 10px var(--mono);
            border-radius: 4px;
            margin-left: 5px;
        }

        .toolbar-right {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .search {
            position: relative;
        }

        .search .bi {
            position: absolute;
            left: 10px;
            top: 11px;
            color: var(--muted);
            font-size: 13px;
        }

        .search input {
            width: 184px;
            padding: 8px 10px 8px 31px;
            font-size: 11px;
            background: transparent;
        }

        .sessions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            align-items: start;
        }

        .sessions.list {
            grid-template-columns: minmax(0, 1fr);
        }

        .session {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            min-width: 0;
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: enter .25s ease-out;
            scroll-margin-top: 20px;
        }

        .session:focus {
            outline: 2px solid var(--accent);
        }

        .session-header {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 17px 18px 12px;
        }

        .session-symbol {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            flex: 0 0 32px;
            border-radius: 6px;
            background: var(--accent-bg);
            color: var(--accent);
        }

        .session[data-color="1"] .session-symbol {
            color: #a16a18;
            background: #fcf1da;
        }

        .session[data-color="2"] .session-symbol {
            color: #4368b1;
            background: #edf1fc;
        }

        .session[data-color="3"] .session-symbol {
            color: #b65b7d;
            background: #fbeef3;
        }

        .session-heading {
            min-width: 0;
            flex: 1;
        }

        .session-key {
            font: 500 12px/1.5 var(--mono);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-source {
            color: var(--muted);
            font-size: 10px;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-header .icon-btn {
            width: 27px;
            flex-basis: 27px;
            height: 30px;
        }

        .session-status-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            padding: 0 18px 12px;
            color: var(--muted);
            font-size: 10px;
        }

        .badge {
            color: var(--muted);
            font-size: 10px;
        }

        .badge[data-state="live"],
        .badge[data-state="complete"] {
            color: var(--accent);
        }

        .badge[data-state="connecting"],
        .badge[data-state="retrying"] {
            color: var(--amber);
        }

        .badge[data-state="error"] {
            color: var(--danger);
        }

        .badge[data-state="live"] .dot {
            box-shadow: 0 0 0 3px var(--accent-bg);
        }

        .session-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 14px;
            border-block: 1px solid var(--line);
            background: var(--page);
        }

        .view-select {
            border: 0;
            background: transparent;
            font-size: 10px;
            padding: 4px 16px 4px 2px;
        }

        .session-actions {
            display: flex;
            align-items: center;
            gap: 1px;
        }

        .session-actions .icon-btn {
            width: 29px;
            height: 28px;
            flex-basis: 29px;
        }

        .session-actions .bi {
            font-size: 14px;
        }

        .values {
            max-height: 365px;
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            overflow-anchor: none;
        }

        .value-slot {
            overflow: hidden;
        }

        .value-row {
            padding: 15px 18px;
            border-bottom: 1px solid var(--line);
            position: relative;
        }

        .value-slot:last-child .value-row {
            border-bottom: 0;
        }

        .value-meta {
            display: flex;
            align-items: center;
            gap: 7px;
            font: 9px var(--mono);
            color: var(--muted);
            margin-bottom: 9px;
            min-width: 0;
        }

        .value-id {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .value-type {
            margin-left: auto;
            font: 9px var(--sans);
            white-space: nowrap;
        }

        .value-row pre {
            margin: 0;
            font: 12px/1.75 var(--mono);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: var(--ink);
            max-height: 230px;
            overflow: auto;
        }

        .value-actions {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-left: auto;
        }

        .value-actions .icon-btn {
            width: 23px;
            height: 23px;
            flex-basis: 23px;
        }

        .value-actions .bi {
            font-size: 12px;
        }

        .session-empty {
            min-height: 150px;
            padding: 30px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            color: var(--muted);
            text-align: center;
            font-size: 11px;
        }

        .session-empty .bi {
            font-size: 22px;
            opacity: .5;
        }

        .session-error {
            margin: 12px 18px;
            padding: 10px 12px;
            border-radius: 4px;
            background: var(--danger-bg);
            color: var(--danger);
            font-size: 11px;
            overflow-wrap: anywhere;
        }

        .session-footer {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 18px;
            font-size: 9px;
            color: var(--muted);
            border-top: 1px solid var(--line);
        }

        .event-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 18px;
            border-bottom: 1px solid var(--line);
            font-size: 10px;
            overflow-wrap: anywhere;
        }

        .event-row time {
            color: var(--muted);
            flex-shrink: 0;
            font: 9px/1.7 var(--mono);
        }

        .event-row .event-label {
            color: var(--accent);
            min-width: 43px;
        }

        .event-row.open .event-label,
        .event-row.added .event-label {
            color: var(--signal);
        }

        .event-row.expired .event-label {
            color: var(--amber);
        }

        .empty-workspace {
            min-height: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 14px;
            border-block: 1px dashed var(--line);
            background-image: radial-gradient(var(--line) .6px, transparent .6px);
            background-size: 18px 18px;
        }

        .empty-symbol {
            color: var(--accent);
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            background: var(--accent-bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 3px;
        }

        .empty-symbol .bi {
            font-size: 28px;
        }

        .empty-workspace h2 {
            font-size: 17px;
        }

        .empty-workspace .muted {
            font-size: 12px;
        }

        dialog {
            width: min(580px, calc(100% - 32px));
            max-height: calc(100dvh - 32px);
            padding: 0;
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 24px 100px #0003;
        }

        dialog::backdrop {
            background: #17212b65;
            backdrop-filter: blur(3px);
        }

        .dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 24px 16px;
        }

        .dialog-header h2 {
            font-size: 20px;
        }

        .dialog-body {
            padding: 4px 24px 24px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin: 16px 0;
            min-width: 0;
            font-size: 12px;
        }

        .field>span,
        .field>label {
            font-weight: 600;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field-row .field {
            margin-top: 0;
        }

        .payload-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .payload-label .segments span {
            font-size: 10px;
            padding: 4px 9px;
        }

        #putValue {
            width: 100%;
            min-height: 165px;
        }

        .payload-footer {
            display: flex;
            justify-content: space-between;
            font: 10px var(--mono);
            color: var(--muted);
            margin-top: 7px;
        }

        details {
            border-top: 1px solid var(--line);
            margin-top: 20px;
            padding-top: 15px;
        }

        summary {
            cursor: pointer;
            font-size: 12px;
            color: var(--muted);
        }

        details .field-row {
            margin-top: 15px;
        }

        .dialog-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 22px;
        }

        .check-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--muted);
        }

        .form-message {
            font-size: 12px;
            padding: 10px 12px;
            margin-top: 15px;
            background: var(--accent-bg);
            color: var(--accent);
            border-radius: 4px;
            overflow-wrap: anywhere;
        }

        .form-message.error {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .inspect-meta {
            display: grid;
            grid-template-columns: 80px minmax(0, 1fr);
            gap: 9px 14px;
            font-size: 11px;
            margin: 14px 0 20px;
        }

        .inspect-meta dt {
            color: var(--muted);
        }

        .inspect-meta dd {
            margin: 0;
            font-family: var(--mono);
            overflow-wrap: anywhere;
        }

        #inspectPayload {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font: 12px/1.7 var(--mono);
            max-height: 360px;
            overflow: auto;
            background: var(--page);
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 4px;
        }

        .toast-stack {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: min(360px, calc(100% - 32px));
            pointer-events: none;
        }

        .toast {
            background: var(--ink);
            color: var(--surface);
            border-radius: 6px;
            padding: 12px 17px;
            box-shadow: var(--shadow);
            font-size: 12px;
            animation: enter .2s ease-out;
            overflow-wrap: anywhere;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 760px) {
            .server-control input {
                font-size: 12px;
            }

            .dialog-header {
                padding: 18px 18px 12px;
            }

            .dialog-body {
                padding: 4px 18px 18px;
            }

            .toast-stack {
                right: 16px;
                bottom: 16px;
            }

        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
        :root {
            --page: #f4f6f5;
            --surface: #fff;
            --subtle: #e9eeeb;
            --ink: #242b29;
            --muted: #65756e;
            --line: #d7dfda;
            --accent: #c7402b;
            --accent-bg: #fce8e2;
            --signal: #177d63;
            --dock: #242b29;
            --dock-ink: #f4f6f5;
        }

        [data-theme="dark"] {
            --page: #181d1b;
            --surface: #202723;
            --subtle: #2c3530;
            --ink: #e4ede7;
            --muted: #9eafa5;
            --line: #36443b;
            --accent: #ff8e72;
            --accent-bg: #4a2d24;
            --signal: #79d8ad;
            --dock: #e4ede7;
            --dock-ink: #242b29;
        }

        body {
            height: 100dvh;
            overflow: hidden;
            background-image: radial-gradient(var(--line) .65px, transparent .65px);
            background-size: 20px 20px;
        }

        .identity {
            position: fixed;
            left: 28px;
            bottom: 26px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .brand { gap: 8px; }
        .brand img { width: 25px; height: 25px; }
        .brand-name { font-size: 19px; font-weight: 650; }
        .connection-trigger {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 0;
            min-height: 28px;
            padding: 4px 8px;
            background: transparent;
            font: 10px/1 var(--mono);
            color: var(--muted);
        }
        .connection-trigger .bi { font-size: 10px; }
        .connected { color: var(--signal); }
        .connection-pill { font: inherit; }

        .instrument {
            width: 100%;
            height: 100%;
            max-width: none;
            padding: 0 0 136px;
            margin: 0;
        }

        .sessions,
        .sessions:not(.list) {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(min(360px, calc(100vw - 32px)), 1fr);
            grid-template-columns: none;
            align-items: stretch;
            gap: 0;
            height: 100%;
            padding: 28px 16px 12px;
            overflow: auto;
            overscroll-behavior-x: contain;
            scroll-snap-type: x proximity;
            scrollbar-width: thin;
            scrollbar-color: var(--line) transparent;
        }

        .session {
            --channel: #177d63;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: transparent;
            border: 0;
            border-right: 1px solid var(--line);
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            scroll-snap-align: start;
            scroll-margin: 16px;
            animation: channel-enter .45s cubic-bezier(.16, 1, .3, 1) both;
        }
        .session:last-child { border-right: 0; }
        .session[data-color="1"] { --channel: #bd493b; }
        .session[data-color="2"] { --channel: #3879b7; }
        .session[data-color="3"] { --channel: #a56d24; }
        [data-theme="dark"] .session { --channel: #79d8ad; }
        [data-theme="dark"] .session[data-color="1"] { --channel: #ff9584; }
        [data-theme="dark"] .session[data-color="2"] { --channel: #7ab8f0; }
        [data-theme="dark"] .session[data-color="3"] { --channel: #eac57b; }
        .session-header { padding: 12px 22px 10px; gap: 10px; align-items: flex-start; }
        .session-symbol,
        .session[data-color] .session-symbol {
            width: 26px;
            flex-basis: 26px;
            height: 28px;
            border-radius: 0;
            background: transparent;
            color: var(--channel);
            border-top: 2px solid currentColor;
            padding-top: 6px;
            font: 11px var(--mono);
        }
        .session-key { font: 500 17px/1.5 var(--mono); }
        .session-source { font: 10px/1.6 var(--mono); margin-top: 6px; }
        .session-header .icon-btn { width: 26px; flex-basis: 26px; height: 28px; }
        .session-status-row { padding: 5px 22px 18px 58px; font-size: 10px; }
        .badge[data-state="live"], .badge[data-state="complete"] { color: var(--signal); }
        .badge[data-state="live"] .dot { box-shadow: none; }
        .session-controls {
            margin: 0 22px;
            padding: 7px 0;
            background: transparent;
        }
        .view-select { font-family: var(--mono); }
        .values { flex: 1; min-height: 0; max-height: none; padding: 8px 0 24px; }
        .value-row { padding: 20px 22px 24px; border-bottom-style: dashed; }
        .value-row pre { font-size: 14px; line-height: 1.85; max-height: 360px; }
        .value-meta { margin-bottom: 12px; font-size: 10px; }
        .value-type { font: 9px var(--mono); min-width: 0; max-width: 55%; overflow: hidden; text-overflow: ellipsis; }
        .value-actions { gap: 6px; }
        .session-footer { margin: 0 22px; padding: 12px 0; font: 9px var(--mono); flex-wrap: wrap; }
        .session-empty { min-height: 180px; height: 100%; font: 11px var(--mono); }
        .session-empty .bi { color: var(--channel); }
        .session-error { margin: 12px 22px; }
        .event-row { padding: 12px 22px; }

        .sessions.list { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: minmax(0, 1fr); align-content: start; }
        .sessions.list .session { min-height: 320px; border-right: 0; border-bottom: 1px solid var(--line); }
        .sessions.list .values { max-height: 480px; flex: auto; }

        .empty-workspace {
            position: absolute;
            inset: 0 0 136px;
            min-height: 0;
            border: 0;
            background: none;
            gap: 12px;
            padding-bottom: 110px;
            pointer-events: none;
        }
        .empty-symbol { display: none; }
        .empty-workspace h1 { font-size: 44px; font-weight: 500; }
        .empty-workspace .muted { font: 11px var(--mono); }
        .empty-workspace .icon-btn { display: none; }

        .command-dock {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: min(660px, calc(100% - 400px));
            min-width: 400px;
            padding: 8px;
            border: 1px solid color-mix(in srgb, var(--dock-ink) 18%, transparent);
            border-radius: 8px;
            background: var(--dock);
            color: var(--dock-ink);
            box-shadow: 0 12px 36px #15251b20;
            z-index: 4;
            transition: bottom .5s cubic-bezier(.16, 1, .3, 1);
        }
        body:has(.empty-workspace:not([hidden])) .command-dock { bottom: calc(50% - 24px); }
        .session-form { gap: 6px; margin: 0; }
        .key-field input {
            height: 46px;
            min-height: 46px;
            padding: 10px 8px 10px 32px;
            background: transparent;
            color: var(--dock-ink);
            border-color: transparent;
            border-radius: 3px;
            font: 12px var(--mono);
        }
        .key-field input::placeholder { color: inherit; opacity: .6; }
        .key-field > .bi { left: 10px; top: 16px; color: var(--dock-ink); opacity: .55; }
        .command-dock .segments { background: transparent; border: 0; padding: 0; }
        .command-dock .segments label>span { color: var(--dock-ink); opacity: .55; padding: 9px; font-size: 10px; }
        .command-dock .segments input:checked + span { background: color-mix(in srgb, var(--dock-ink) 12%, transparent); border-color: transparent; color: var(--dock-ink); opacity: 1; box-shadow: none; }
        .command-dock .icon-btn { width: 42px; height: 44px; flex-basis: 42px; color: var(--dock-ink); border-radius: 4px; }
        .command-dock .icon-btn:hover { background: color-mix(in srgb, var(--dock-ink) 12%, transparent); border-color: transparent; }
        .command-dock .launch { background: #d34830; color: #fff; }
        .command-dock .launch:hover { background: #b73621; }
        .dock-divider { width: 1px; align-self: stretch; margin: 9px 2px; background: color-mix(in srgb, var(--dock-ink) 20%, transparent); }

        .workspace-edge {
            position: fixed;
            right: 28px;
            bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 3;
        }
        .workspace-tally { color: var(--muted); font: 10px/1.8 var(--mono); text-align: right; }
        .workspace-tally span { color: var(--ink); }
        .workspace-edge > .icon-btn { border: 1px solid var(--line); background: var(--page); width: 40px; height: 40px; }
        .workspace-toolbar { margin: 0; padding-bottom: 14px; border-bottom: 1px solid var(--line); gap: 14px; }
        .tabs { gap: 14px; flex-wrap: wrap; }
        .tab { font-size: 11px; }
        .tab-count { min-width: 16px; padding-inline: 3px; }
        .toolbar-right { width: 100%; }
        .search { flex: 1; }
        .search input { width: 100%; }
        .directory { padding: 14px 0 0; max-height: 40dvh; overflow-y: auto; }
        .directory-item { background: transparent; }
        .directory .section-label { padding-inline: 0; }
        .directory-key { font-size: 12px; }
        .dialog-tools { display: flex; align-items: center; gap: 8px; padding-top: 16px; }
        .dialog-tools a { margin-left: auto; color: var(--muted); }
        .network-pair { padding-block: 16px; border-block: 1px solid var(--line); }
        .network-pair strong { font: 12px var(--mono); }
        .node-line { margin-bottom: 20px; }
        .connection-detail { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; color: var(--muted); font: 11px var(--mono); }
        .btn.primary { background: #c7402b; border-color: #c7402b; }
        .btn.primary:hover:not(:disabled) { background: #aa3220; }
        .toast-stack { bottom: 108px; }
        @keyframes channel-enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 1100px) {
            .identity { left: 20px; bottom: 27px; }
            .brand-name { font-size: 16px; }
            .command-dock { width: calc(100% - 320px); min-width: 380px; }
            .workspace-edge { right: 20px; }
            .workspace-tally { display: none; }
        }
        @media (max-width: 760px) {
            .instrument { padding-bottom: 176px; }
            .sessions, .sessions:not(.list) { padding: 16px 8px 0; grid-auto-columns: calc(100vw - 32px); scroll-padding-left: 8px; }
            .session { scroll-margin: 8px; }
            .session-header { padding: 10px 16px; }
            .session-key { font-size: 15px; }
            .session-status-row { padding: 4px 16px 14px 52px; }
            .session-controls, .session-footer { margin-inline: 16px; }
            .value-row { padding: 18px 16px 22px; }
            .value-row pre { font-size: 13px; }
            .identity { bottom: 92px; left: 18px; flex-direction: row; align-items: center; gap: 14px; }
            .brand { gap: 6px; }
            .brand img { width: 21px; height: 21px; }
            .brand-name { font-size: 15px; }
            .connection-trigger { font-size: 9px; }
            .command-dock { bottom: max(14px, env(safe-area-inset-bottom)); width: calc(100% - 24px); min-width: 0; padding: 6px; }
            .session-form { flex-wrap: nowrap; gap: 3px; }
            .key-field { flex-basis: auto; }
            .key-field input { font-size: 11px; padding-left: 27px; }
            .session-form .segments, .session-form .segments label { flex: 0 0 auto; }
            .command-dock .segments label>span { padding: 10px 7px; }
            .command-dock .mode-label { display: none; }
            .command-dock .icon-btn { width: 36px; flex-basis: 36px; }
            .workspace-edge { bottom: 87px; right: 16px; }
            .workspace-edge > .icon-btn { width: 32px; height: 32px; }
            .empty-workspace { bottom: 176px; }
            .empty-workspace h1 { font-size: 36px; }
            .toolbar-right { gap: 4px; }
            .tabs { justify-content: flex-start; gap: 16px; }
            .toast-stack { bottom: 144px; }
        }
        @media (max-height: 540px) and (min-width: 761px) {
            .instrument { padding-bottom: 104px; }
            .empty-workspace { bottom: 104px; gap: 8px; }
            .empty-symbol { display: none; }
        }
    </style>
</head>

        <button class="connection-trigger" id="connectionBtn" title="Proxy connection" aria-haspopup="dialog">
            <span class="connection-pill" id="topStatus"><span class="dot"></span>Offline</span>
            <i class="bi bi-chevron-expand" aria-hidden="true"></i>
        </button>
    </div>
    <dialog id="connectionDialog" aria-labelledby="connectionTitle">
        <div class="dialog-header"><h2 id="connectionTitle">Proxy connection</h2><button class="icon-btn" data-close="connectionDialog" title="Close" aria-label="Close connection"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div>
        <div class="dialog-body">
                <div class="section-label"><span class="badge" id="connectionBadge"><span
                            class="dot"></span>Offline</span></div>
                <form id="serverForm"><label class="server-label" for="serverValue">Endpoint</label>
                    <div class="server-control">
                        <input id="serverValue" type="url" value="http://127.0.0.1:8080" required spellcheck="false"
                            aria-label="Proxy server URL">
                        <button class="icon-btn" id="serverBtn" type="submit" title="Connect to proxy"
                            aria-label="Connect to proxy"><i class="bi bi-arrow-clockwise"
                                aria-hidden="true"></i></button>
                    </div>
                </form>
                <div class="connection-error" id="connectionError" role="status" hidden></div>
                <div class="node-line"><i class="bi bi-hdd-network" aria-hidden="true"></i><span class="node-id mono"
                        id="nodeId">No node connected</span><button class="icon-btn" id="copyNodeBtn"
                        title="Copy node ID" aria-label="Copy node ID" disabled><i class="bi bi-copy"
                            aria-hidden="true"></i></button></div>
                <div class="network-pair">
                    <div><span>IPv4</span><strong id="ipv4Status">Unavailable</strong></div>
                    <div><span>IPv6</span><strong id="ipv6Status">Unavailable</strong></div>
                </div>
                <div class="connection-detail"><span><span id="latency">--</span> ms</span><span><span id="eventCount">0</span> events received</span></div>
        </div>
    </dialog>
    <main class="instrument" aria-label="Live DHT channels">
        <div class="sessions" id="sessions"></div>
        <div class="empty-workspace" id="emptyWorkspace">
            <h1 id="emptyTitle">OpenDHT</h1>
            <span class="muted" id="emptyDescription">No open channels</span>
        </div>
    </main>
    <div class="command-dock">
            <form class="session-form" id="sessionForm">
                <div class="key-field"><i class="bi bi-key" aria-hidden="true"></i><input id="getKey"
                        placeholder="Key or hash" aria-label="Session key" required spellcheck="false"
                        autocomplete="off" list="knownKeys"></div>
                <div class="segments" aria-label="Session mode"><label><input type="radio" name="sessionMode"
                            value="listen" aria-label="Listen" checked><span><i class="bi bi-broadcast"
                                aria-hidden="true"></i><span class="mode-label">Listen</span></span></label><label><input type="radio"
                            name="sessionMode" value="get" aria-label="Get"><span><i class="bi bi-arrow-down"
                                aria-hidden="true"></i><span class="mode-label">Get</span></span></label></div>
                <button class="icon-btn launch" type="submit" title="Open channel" aria-label="Open channel"><i class="bi bi-arrow-right" aria-hidden="true"></i></button>
                <span class="dock-divider" aria-hidden="true"></span>
                <button class="icon-btn" id="openPublishBtn" type="button" title="Publish value" aria-label="Publish value"><i class="bi bi-arrow-up-right" aria-hidden="true"></i></button>
            </form>
    </div>
    <div class="workspace-edge">
        <div class="workspace-tally"><div><span id="activeCount">0</span> live</div><div><span id="valueCount">0</span> values</div></div>
        <button class="icon-btn" id="workspaceBtn" title="Channels and controls" aria-label="Channels and controls" aria-haspopup="dialog"><i class="bi bi-grid" aria-hidden="true"></i></button>
    </div>
    <dialog id="workspaceDialog" aria-labelledby="workspaceTitle">
        <div class="dialog-header"><h2 id="workspaceTitle">Channels</h2><button class="icon-btn" data-close="workspaceDialog" title="Close" aria-label="Close channels"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div>
        <div class="dialog-body">
            <div class="workspace-toolbar">
                <div class="tabs" aria-label="Session filter"><button class="tab" data-filter="all"
                        aria-pressed="true">All<span class="tab-count" id="allCount">0</span></button><button
                        class="tab" data-filter="active" aria-pressed="false">Active<span class="tab-count"
                            id="runningCount">0</span></button><button class="tab" data-filter="stopped"
                        aria-pressed="false">Inactive<span class="tab-count" id="stoppedCount">0</span></button></div>
                <div class="toolbar-right">
                    <div class="search"><i class="bi bi-search" aria-hidden="true"></i><input id="searchInput"
                            type="search" placeholder="Filter keys or values" aria-label="Filter keys or values"></div>
                    <button class="icon-btn" id="layoutBtn" title="Stack channels"
                        aria-label="Stack channels" aria-pressed="false"><i class="bi bi-view-list"
                            aria-hidden="true"></i></button><button class="icon-btn" id="stopAllBtn"
                        title="Stop all sessions" aria-label="Stop all sessions" disabled><i class="bi bi-stop-circle"
                            aria-hidden="true"></i></button><button class="icon-btn" id="settingsBtn"
                        title="Workspace settings" aria-label="Workspace settings"><i class="bi bi-sliders2"
                            aria-hidden="true"></i></button>
                </div>
            </div>
            <nav class="directory" aria-label="Sessions">
                <div class="section-label">Keys <button class="icon-btn" id="newSessionBtn" title="Open a channel" aria-label="Open a channel"><i class="bi bi-plus-lg" aria-hidden="true"></i></button></div>
                <div id="sessionDirectory"></div>
            </nav>
            <div class="dialog-tools">
                <button class="icon-btn" id="exportAllBtn" title="Export workspace values" aria-label="Export workspace values"><i class="bi bi-download" aria-hidden="true"></i></button>
                <button class="icon-btn" id="themeBtn" title="Switch color theme" aria-label="Switch color theme"><i class="bi bi-moon" aria-hidden="true"></i></button>
                <a href="https://github.com/savoirfairelinux/opendht" target="_blank" rel="noopener noreferrer" title="OpenDHT on GitHub" aria-label="OpenDHT on GitHub"><i class="bi bi-github" aria-hidden="true"></i></a>
            </div>
        </div>
    </dialog>
    <datalist id="knownKeys"></datalist>
    <dialog id="publishDialog" aria-labelledby="publishTitle">
        <div class="dialog-header">
            <h2 id="publishTitle">Publish value</h2><button class="icon-btn" data-close="publishDialog" title="Close"
                aria-label="Close publish dialog"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        </div>
        <form class="dialog-body" id="publishForm">
            <label class="field"><span>Key</span><input id="putKey" required placeholder="Key or hash" list="knownKeys"
                    spellcheck="false"></label>
            <label class="field"><span>Proxy endpoint</span><input id="putServer" type="url" required
                    spellcheck="false"></label>
            <div class="payload-label"><label for="putValue">Payload</label>
                <div class="segments" aria-label="Payload encoding"><label><input type="radio" name="putEncoding"
                            value="text" checked><span>Text</span></label><label><input type="radio" name="putEncoding"
                            value="json"><span>JSON</span></label><label><input type="radio" name="putEncoding"
                            value="base64"><span>Base64</span></label></div>
            </div>
            <textarea id="putValue" placeholder="Value" aria-label="Value payload" spellcheck="false"></textarea>
            <div class="payload-footer"><span id="payloadBytes">0 bytes</span><span id="payloadEncoding">UTF-8</span>
            </div>
            <details>
                <summary>Value metadata</summary>
                <div class="field-row"><label class="field"><span>Type</span><input id="putType" type="number" min="0"
                            max="65535" step="1" placeholder="Default"></label><label class="field"><span>User
                            type</span><input id="putUserType" placeholder="Optional"></label></div>
            </details>
            <div class="form-message" id="publishMessage" role="status" hidden></div>
            <div class="dialog-footer"><label class="check-label"><input id="listenAfterPut" type="checkbox"
                        checked>Listen to this key</label><button class="btn primary" type="submit" id="putBtn"><i
                        class="bi bi-arrow-up-right" aria-hidden="true"></i><span>Publish</span></button></div>
        </form>
    </dialog>
    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
        <div class="dialog-header">
            <h2 id="settingsTitle">Workspace settings</h2><button class="icon-btn" data-close="settingsDialog"
                title="Close" aria-label="Close settings"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        </div>
        <div class="dialog-body">
            <label class="field check-label"><span><input id="autoRetry" type="checkbox" checked> Automatically
                    reconnect listeners</span></label>
            <label class="field check-label"><span><input id="rememberSessions" type="checkbox" checked> Remember
                    session keys (restore stopped)</span></label>
            <label class="field"><span>Default value format</span><select id="defaultView">
                    <option value="text">Text</option>
                    <option value="json">JSON</option>
                    <option value="base64">Base64</option>
                    <option value="hex">Hex</option>
                </select></label>
            <div class="dialog-footer"><button class="btn" id="resumeAllBtn"><i class="bi bi-play"
                        aria-hidden="true"></i>Resume listeners</button><button class="btn" id="removeStoppedBtn"><i
                        class="bi bi-trash3" aria-hidden="true"></i>Remove inactive</button></div>

        function exportSession(session) { download('opendht-session-' + session.id + '.json', JSON.stringify({ key: session.key, proxy: session.endpoint, exported: new Date().toISOString(), values: [...session.values.values()] }, null, 2)); }
        function inspect(value, session) {
            inspectedValue = value; const meta = $('inspectMeta'); meta.replaceChildren();
            for (const [key, content] of Object.entries({ key: session.key, proxy: session.endpoint, ...value })) {
                if (key !== 'data' && key !== 'cypher') meta.append(element('dt', '', key), element('dd', '', typeof content === 'object' ? JSON.stringify(content) : String(content)));
            }
            $('inspectPayload').textContent = formatValue(value, 'json'); $('inspectDialog').showModal();
        }
        function openPublish(session) {
            $('putKey').value = session ? session.key : $('getKey').value; $('putServer').value = session ? session.endpoint : server;
            $('publishMessage').hidden = true; $('publishDialog').showModal(); $('putValue').focus();
        }
        function payloadBytes() {
            const encoding = document.querySelector('input[name="putEncoding"]:checked').value; const text = $('putValue').value;
            if (encoding === 'base64') return bytesFromBase64(text.replace(/\s/g, ''));
            if (encoding === 'json') JSON.parse(text);
            return new TextEncoder().encode(text);
        }
        function updatePayloadSize() {
            try { $('payloadBytes').textContent = payloadBytes().length.toLocaleString() + ' bytes'; }
            catch { $('payloadBytes').textContent = 'Invalid ' + document.querySelector('input[name="putEncoding"]:checked').value; }
            $('payloadEncoding').textContent = document.querySelector('input[name="putEncoding"]:checked').value === 'base64' ? 'BINARY' : 'UTF-8';
        }
        async function publish(event) {
            event.preventDefault(); const message = $('publishMessage'); message.hidden = true;
            let endpoint, payload; const key = $('putKey').value.trim(); const listenAfter = $('listenAfterPut').checked;
            try {
                if (!key) throw new Error('Enter a key.');
                endpoint = normalizeServer($('putServer').value); payload = { data: base64FromBytes(payloadBytes()) };
                if ($('putType').value !== '') payload.type = Number($('putType').value);
                if ($('putUserType').value) payload.utype = $('putUserType').value;
            } catch (error) { message.textContent = error.message; message.classList.add('error'); message.hidden = false; return; }
            $('putBtn').disabled = true; $('putBtn').querySelector('i').className = 'bi bi-arrow-repeat spin';
            const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 30000);
            try {
                const response = await fetch(endpoint + '/' + encodeURIComponent(key), { method: 'POST', signal: controller.signal, headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error('Publish failed: HTTP ' + response.status);
                const text = await response.text(); const value = text.trim() ? parseWire(text) : null;
                message.classList.remove('error'); message.textContent = 'Published successfully' + (value && value.id !== undefined ? ' / ID ' + value.id : ''); message.hidden = false;
                toast('Value published to ' + key);
                if (listenAfter && ![...sessions.values()].some((session) => session.key === key && session.endpoint === endpoint && session.mode === 'listen' && active(session))) createSession(key, 'listen', endpoint);
            } catch (error) {
                message.classList.add('error'); message.textContent = error.name === 'AbortError' ? 'Publish timed out. The value may still have reached the DHT.' : error.message; message.hidden = false;
            } finally { clearTimeout(timeout); $('putBtn').disabled = false; $('putBtn').querySelector('i').className = 'bi bi-arrow-up-right'; }
        }
        function focusKey() {
            $('workspaceDialog').close(); document.querySelector('input[name="sessionMode"][value="listen"]').checked = true; $('getKey').focus();
        }
        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme; $('themeBtn').replaceChildren(icon(theme === 'dark' ? 'sun' : 'moon'));
            document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#181d1b' : '#f4f6f5';
        }
        $('serverForm').addEventListener('submit', (event) => { event.preventDefault(); connect(); });
        $('copyNodeBtn').addEventListener('click', () => { if (nodeInfo) copy(nodeInfo.node_id); });
        $('sessionForm').addEventListener('submit', (event) => {
            event.preventDefault();
            try { const session = createSession($('getKey').value, document.querySelector('input[name="sessionMode"]:checked').value); $('getKey').value = ''; session.node.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' }); }
            catch (error) { toast(error.message); }
        });
        $('newSessionBtn').addEventListener('click', focusKey);
        $('stopAllBtn').addEventListener('click', () => { for (const session of sessions.values()) if (active(session)) stopSession(session); });
        $('searchInput').addEventListener('input', () => { search = $('searchInput').value.trim().toLowerCase(); for (const session of sessions.values()) schedule(session); schedule(); });
        for (const tab of document.querySelectorAll('[data-filter]')) tab.addEventListener('click', () => { filter = tab.dataset.filter; schedule(); });
        $('layoutBtn').addEventListener('click', () => {
            const list = $('sessions').classList.toggle('list'); $('layoutBtn').setAttribute('aria-pressed', String(list)); $('layoutBtn').replaceChildren(icon(list ? 'grid' : 'view-list'));
            $('layoutBtn').title = list ? 'Arrange channels side by side' : 'Stack channels'; $('layoutBtn').setAttribute('aria-label', $('layoutBtn').title); persist();
        });
        $('themeBtn').addEventListener('click', () => { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); persist(); });
        $('openPublishBtn').addEventListener('click', () => openPublish()); $('publishForm').addEventListener('submit', publish); $('putValue').addEventListener('input', updatePayloadSize);
        for (const radio of document.querySelectorAll('input[name="putEncoding"]')) radio.addEventListener('change', updatePayloadSize);
        for (const button of document.querySelectorAll('[data-close]')) button.addEventListener('click', () => $(button.dataset.close).close());
        for (const dialog of document.querySelectorAll('dialog')) dialog.addEventListener('click', (event) => {
            const rect = dialog.getBoundingClientRect();
            if (event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) dialog.close();
        });
        $('connectionBtn').addEventListener('click', () => $('connectionDialog').showModal());
        $('workspaceBtn').addEventListener('click', () => $('workspaceDialog').showModal());
        $('settingsBtn').addEventListener('click', () => { $('workspaceDialog').close(); $('settingsDialog').showModal(); });
        $('autoRetry').checked = settings.autoRetry; $('rememberSessions').checked = settings.remember; $('defaultView').value = settings.view;
        $('autoRetry').addEventListener('change', () => { settings.autoRetry = $('autoRetry').checked; if (!settings.autoRetry) for (const session of sessions.values()) if (session.retryTimer) stopSession(session); persist(); });
        $('rememberSessions').addEventListener('change', () => { settings.remember = $('rememberSessions').checked; persist(); });
        $('defaultView').addEventListener('change', () => { settings.view = $('defaultView').value; persist(); });
        $('resumeAllBtn').addEventListener('click', () => { for (const session of sessions.values()) if (session.mode === 'listen' && !active(session)) startSession(session); $('settingsDialog').close(); });
        $('removeStoppedBtn').addEventListener('click', () => { for (const session of [...sessions.values()]) if (!active(session)) removeSession(session); $('settingsDialog').close(); });
        $('exportAllBtn').addEventListener('click', () => download('opendht-workspace.json', JSON.stringify({ exported: new Date().toISOString(), sessions: [...sessions.values()].map((session) => ({ key: session.key, proxy: session.endpoint, mode: session.mode, state: session.state, values: [...session.values.values()] })) }, null, 2)));
        $('inspectCopyBtn').addEventListener('click', () => { if (inspectedValue) copy(JSON.stringify(inspectedValue, null, 2)); });
        $('inspectDownloadBtn').addEventListener('click', () => { if (inspectedValue) download('value-' + inspectedValue.id + '.bin', bytesFromBase64(inspectedValue.cypher ?? inspectedValue.data), 'application/octet-stream'); });
        window.addEventListener('online', () => { connect(); for (const session of sessions.values()) if (session.retryTimer && settings.autoRetry) startSession(session); });
        window.addEventListener('pagehide', () => { for (const session of sessions.values()) stopSession(session, false); });
        window.addEventListener('pageshow', (event) => { if (event.persisted) { connect(); schedule(); } });
        try { if (typeof saved.server === 'string') server = normalizeServer(saved.server); } catch { }
        $('serverValue').value = server; applyTheme(saved.theme === 'dark' ? 'dark' : 'light');
        if (saved.list) $('layoutBtn').click();
        if (settings.remember && Array.isArray(saved.sessions)) {
            for (const session of saved.sessions) {
                try { if (typeof session.key === 'string' && ['get', 'listen'].includes(session.mode)) createSession(session.key, session.mode, session.endpoint, true, ['text', 'json', 'base64', 'hex'].includes(session.view) ? session.view : settings.view); } catch { }
            }
        }
        renderWorkspace(); connect();
    </script>
</body>

</html>
